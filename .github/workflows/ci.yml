name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs:
          - '29.4'
          - '30.1'
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Compile package
        run: emacs -Q --batch --eval '(byte-recompile-directory "." 0)'
      - name: Run tests
        run: emacs -Q --batch -L . -l rainbow-csv-mode.el -l rainbow-csv-mode-tests.el -f ert-run-tests-batch-and-exit
