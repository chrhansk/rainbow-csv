name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        emacs:
          - '29.4'
          - '30.1'

    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs
        with:
          version: ${{ matrix.emacs }}

      - name: Compile package
        run: emacs -Q --batch --eval '(byte-recompile-directory "." 0)'
